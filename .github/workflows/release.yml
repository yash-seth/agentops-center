name: Release

# Tag a release (git tag v0.1.0 && git push --tags) to: re-run the quality gates, publish the three
# images to GHCR, and attach a registry snapshot (agent specs + eval scores) to the GitHub release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  AOC_EMBEDDER: hash
  AOC_LLM_PROVIDERS: fake
  AOC_TELEMETRY_ENABLED: "false"

jobs:
  verify:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12 --extra pgvector --extra ui
      - run: uv run ruff check .
      - run: uv run aoc validate
      - run: uv run pytest
      - name: Eval gate and scores
        run: uv run aoc eval --check --out evals/out/scores.json --markdown evals/out/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: eval-scores
          path: evals/out/

  images:
    name: Publish ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [gateway, console-api, console-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentops-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  registry-snapshot:
    name: Registry snapshot
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --python 3.12
      - uses: actions/download-artifact@v4
        with:
          name: eval-scores
          path: evals/out
      - name: Register agents with their eval scores and export snapshots
        run: uv run aoc register --scores evals/out/scores.json --export registry-export
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            registry-export/*.json
            evals/out/report.md
          generate_release_notes: true
