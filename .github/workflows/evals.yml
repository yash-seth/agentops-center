name: Evals

# The deterministic evals already gate every PR in ci.yml. This workflow runs the fuller evals:
#  - on a PR when it carries the "run-evals" label,
#  - nightly,
#  - on demand.
# With GOOGLE_API_KEY configured it uses the real model and real embeddings, and the score table
# is posted on the PR. Without keys it falls back to the deterministic mode.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      llm:
        description: "fake or real"
        default: fake

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: Agent evals
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-evals')
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      AOC_TELEMETRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: Choose mode
        id: mode
        run: |
          if [ "${{ github.event.inputs.llm }}" = "real" ] || { [ -n "$GOOGLE_API_KEY" ] && [ "${{ github.event.inputs.llm }}" != "fake" ]; }; then
            echo "llm=real" >> "$GITHUB_OUTPUT"
            echo "baseline=evals/baseline.real.json" >> "$GITHUB_OUTPUT"
            echo "AOC_LLM_PROVIDERS=gemini,fake" >> "$GITHUB_ENV"
            echo "AOC_EMBEDDER=fastembed" >> "$GITHUB_ENV"
          else
            echo "llm=fake" >> "$GITHUB_OUTPUT"
            echo "baseline=evals/baseline.fake.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Run evals against the baseline
        id: evals
        continue-on-error: true
        run: |
          uv run aoc eval --llm "${{ steps.mode.outputs.llm }}" \
            --baseline "${{ steps.mode.outputs.baseline }}" \
            --check --out evals/out/scores.json --markdown evals/out/report.md
      - name: Job summary
        if: always()
        run: cat evals/out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-scores
          path: evals/out/
          if-no-files-found: ignore
      - name: Post scores on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- agent-evals -->';
            let body = marker + '\n';
            try { body += fs.readFileSync('evals/out/report.md', 'utf8'); }
            catch (e) { body += 'Evals did not produce a report. See the workflow run.'; }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Fail the job if a metric regressed
        if: steps.evals.outcome == 'failure'
        run: |
          echo "Eval regression detected; see the report above."
          exit 1
