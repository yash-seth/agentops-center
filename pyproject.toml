[project]
name = "agentops-center"
version = "0.1.0"
description = "An operations center for production AI agents: registry, run history, telemetry, incidents, replay."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.1",
    "langchain-groq>=0.3",
    "langchain-ollama>=0.3",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "openinference-instrumentation-langchain>=0.1.40",
    "openinference-semantic-conventions>=0.1.14",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "fastembed>=0.5",
    "typer>=0.15",
    "opentelemetry-exporter-prometheus>=0.66b0",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
pgvector = ["psycopg[binary]>=3.2", "pgvector>=0.3"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyyaml",
]
phoenix = ["arize-phoenix>=8.0"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aoc_runtime", "rag", "agents", "data"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
