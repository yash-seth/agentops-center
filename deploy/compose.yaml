name: agentops

# Full local stack:  docker compose -f deploy/compose.yaml up --build
# Offline by default (fake model, hash embeddings). To use real models set GOOGLE_API_KEY /
# GROQ_API_KEY and AOC_LLM_PROVIDERS=gemini,groq,fake AOC_EMBEDDER=fastembed in your shell or .env.

x-app-env: &app-env
  AOC_ENV: dev
  AOC_DB_URL: postgresql+psycopg://aoc:aoc@postgres:5432/aoc
  AOC_PG_DSN: postgresql://aoc:aoc@postgres:5432/aoc
  AOC_VECTOR_STORE: ${AOC_VECTOR_STORE:-pgvector}
  AOC_EMBEDDER: ${AOC_EMBEDDER:-hash}
  AOC_LLM_PROVIDERS: ${AOC_LLM_PROVIDERS:-fake}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  AOC_TRACE_URL_TEMPLATE: http://localhost:6006/projects/UHJvamVjdDox/traces/{trace_id}

x-app-build: &app-build
  context: ..
  dockerfile: deploy/docker/Dockerfile

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aoc
      POSTGRES_PASSWORD: aoc
      POSTGRES_DB: aoc
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aoc -d aoc"]
      interval: 5s
      timeout: 3s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"   # UI + OTLP/HTTP
      - "4317:4317"   # OTLP/gRPC
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes: [phoenixdata:/mnt/data]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"   # OTLP/HTTP from agents
    depends_on: [phoenix]

  console-api:
    build:
      <<: *app-build
      target: console-api
    environment:
      <<: *app-env
      AOC_AUTO_SYNC: "true"
    ports: ["8001:8001"]
    depends_on:
      postgres: {condition: service_healthy}

  gateway:
    build:
      <<: *app-build
      target: gateway
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      console-api: {condition: service_started}

  console-ui:
    build:
      <<: *app-build
      target: console-ui
    environment:
      AOC_CONSOLE_URL: http://console-api:8001
    ports: ["8501:8501"]
    depends_on: [console-api]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    depends_on: [alertmanager]

  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  phoenixdata:
