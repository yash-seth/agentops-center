apiVersion: v1
kind: Service
metadata:
  name: console-api
  labels:
    app.kubernetes.io/name: console-api
    {{- include "agentops.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: console-api
  ports:
    - name: http
      port: 8001
      targetPort: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePorts.consoleApi }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-api
  labels:
    app.kubernetes.io/name: console-api
    {{- include "agentops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.consoleApi.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: console-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console-api
        {{- include "agentops.labels" . | nindent 8 }}
    spec:
      # Do not inject <SERVICE>_PORT env vars (Phoenix crashes on PHOENIX_PORT=tcp://...).
      enableServiceLinks: false
      containers:
        - name: console-api
          image: {{ include "agentops.image" (dict "root" . "name" "console-api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8001
          env:
            {{- include "agentops.appEnv" . | nindent 12 }}
            - name: AOC_AUTO_SYNC
              value: {{ .Values.consoleApi.autoSync | quote }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            {{- include "agentops.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.consoleApi.resources | nindent 12 }}
