{{- if .Values.observability.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    {{- include "agentops.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePorts.grafana }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    {{- include "agentops.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        {{- include "agentops.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s%s%s" (.Files.Get "files/datasource.yml") (.Files.Get "files/dashboards.yml") (.Files.Get "files/agent-health.json") | sha256sum }}
    spec:
      # Do not inject <SERVICE>_PORT env vars (Phoenix crashes on PHOENIX_PORT=tcp://...).
      enableServiceLinks: false
      containers:
        - name: grafana
          image: {{ .Values.observability.grafana.image }}
          env:
            # Anonymous admin is for local demos only. Do not use this in a shared cluster.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.observability.grafana.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
              subPath: datasource.yml
            - name: config
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: config
              mountPath: /var/lib/grafana/dashboards/agent-health.json
              subPath: agent-health.json
      volumes:
        - name: config
          configMap:
            name: grafana-config
{{- end }}
