{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: agentops-secrets
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  google-api-key: {{ .Values.secrets.googleApiKey | quote }}
  groq-api-key: {{ .Values.secrets.groqApiKey | quote }}
{{- end }}
