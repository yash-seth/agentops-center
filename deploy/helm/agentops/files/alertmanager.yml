route:
  receiver: console
  group_by: [alertname, agent, agent_version, tool]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: console
    webhook_configs:
      # The console API opens (or updates) an incident per alert fingerprint. The hostname is
      # the compose service name; the Helm chart uses the console-api Kubernetes service.
      - url: http://console-api:8001/alerts
        send_resolved: true
