global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

# Targets are service names, so this file works unchanged in docker compose and Kubernetes.
# To scrape a process running on your host (for example scripts/generate_traffic.py on :9464),
# add a job that targets host.docker.internal:9464 in a local copy of this file.
scrape_configs:
  - job_name: aoc-gateway
    metrics_path: /metrics/
    static_configs:
      - targets: ["gateway:8000"]
