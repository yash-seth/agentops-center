global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aoc-agents
    static_configs:
      # Agent processes expose /metrics on 9464 (scripts/generate_traffic.py, later the gateway).
      # host.docker.internal reaches the host from Docker Desktop.
      - targets: ["host.docker.internal:9464"]

  - job_name: aoc-gateway
    metrics_path: /metrics/
    static_configs:
      - targets: ["gateway:8000"]
